[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmesh"
version = "0.1.0"
description = "Local-first cross-market quantitative research and trading workstation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
research = [
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "vectorbt>=0.27,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
quantmesh-iteration = "quantmesh.dev.iterations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantmesh = ["data/providers/fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
