[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmesh"
version = "0.1.0rc5"  # PEP 440 release candidate; the operator-accepted line promotes to 0.1.0 (see docs/release-process.md)
description = "Local-first cross-market quantitative research and trading workstation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",  # M9 (ADR-0011): server-rendered workstation pages
  "numpy>=2,<3",
  "python-multipart>=0.0.9,<1",  # M9 Phase B: native workstation forms
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "tzdata>=2024.1",  # zoneinfo on Windows reads the IANA database from tzdata
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
research = [
  # M7 Phase B (ADR-0009 decision 6): the roadmap pipeline codecs are a
  # first-class, CI-tested surface (`.[dev,research]` install).
  # hmmlearn is deliberately absent: its EM is numerically unfit for
  # the HMM codec, which is pure numpy (ADR-0009 decision 7).
  # vectorbt was removed (M10 Phase D, ADR-0012 decision 4): it ships
  # as Apache-2.0 WITH Commons Clause (source-available, not OSI) and
  # no code path imports it.
  "arch>=7,<8",
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]
dev = [
  # PYSEC-2026-1845 affects pytest<9.0.3; keep the resolver from
  # selecting a vulnerable 8.x release. pytest-asyncio 1.x is the
  # compatible line for pytest 9 (1.4.0 allows pytest<10).
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8,<1",
  # M10 Phase E (ADR-0012 decision 5): OS-backed secret store. Only
  # ever exercised against a fixture backend in tests; the real
  # backend refuses construction outside an explicit drill flag, so
  # the OS keyring is never touched by the suite.
  "keyring>=25,<26",
]
e2e = [
  # M9 Phase F (ADR-0011 decision 7): dev-only browser E2E. Browser
  # binaries are installed separately (`playwright install chromium`);
  # the suite skips cleanly when the package or the browser is missing.
  "playwright>=1.44,<2",
]

[project.scripts]
quantmesh-iteration = "quantmesh.dev.iterations:main"
quantmesh-moomoo = "quantmesh.moomoo.cli:main"
quantmesh-workstation = "quantmesh.api.workstation:main"
quantmesh-ops = "quantmesh.ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantmesh = [
  "data/providers/fixtures/*.json",
  "api/templates/*.html",
  "api/static/*.css",
  # The committed SPA bundle (ADR-0013 decision 2): hashed assets plus
  # the root files vite emits (index.html, favicon, icons).
  "api/static/app/*",
  "api/static/app/assets/*",
]

[tool.pytest.ini_options]
# The repo root is on the path so both test import styles resolve under
# bare `pytest` (CI) and `python -m pytest` alike: helper modules are
# imported both bare (`from moomoo_wire import ...` — pytest's basedir
# insertion puts tests/ on the path) and package-qualified
# (`from tests.research_fixtures import ...` — tests/ resolves as a
# namespace package from the root). tests/ intentionally has no
# __init__.py; a package marker would break the bare style.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
