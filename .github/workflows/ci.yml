name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        # The full release closure since iteration 0013 Phase B: the
        # license/audit contract tests (tests/test_security.py) run on
        # every PR and assert the environment IS the closure
        # (.[dev,research,e2e], same as the Security job and the release
        # gate). A narrower install would leave e2e-chain members
        # (playwright/pyee/greenlet) absent on Linux and fail the
        # closure contract.
        run: python -m pip install -e ".[dev,research,e2e]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Review locked frontend licenses
        run: python tools/npm_license_review.py
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Check generated OpenAPI client
        run: npm run check:api
        working-directory: frontend
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npx vitest run
        working-directory: frontend
      - name: Check committed frontend bundle
        run: python tools/build_frontend.py --check
      - name: Lint
        # tools/ exists on main only after the M10 merge; earlier milestone
        # PRs (and their stacked bases) must not fail on a missing path.
        run: ruff check src tests $(test -d tools && echo tools)
      - name: Test
        run: pytest -q
