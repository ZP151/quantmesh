name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        # The research extra is first-class tested surface since M7 Phase B
        # (ADR-0009 decision 6): the pipeline codecs must exist where their
        # tests run. The paper kernel core stays lean without it.
        run: python -m pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

