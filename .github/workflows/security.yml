name: Security

# Runs only when a push to main touches the audit surface: any
# dependency declaration (pyproject.toml — including its extras), the
# frozen install closure, the license-review script, the license
# inventory or this workflow definition itself (so a trigger-surface
# change cannot silently defuse the job). The python job in ci.yml
# runs on every PR to main; the security scan is deliberately NOT on
# the PR path — the audit lock and the review script only exist on
# main after the M10 merge, so earlier milestone merges must not fail a
# job on missing files, and a green scan after the final main PR lands
# is the recorded coverage (iteration 0013 Phase B).

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - requirements-audit.txt
      - tools/license_review.py
      - docs/licenses.md
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project environment
        # The license review reads the installed distributions'
        # metadata, so the environment must be the deterministic
        # release closure: `.[dev,research,e2e]`, the same install the
        # release gate and operator acceptance use (iteration 0013
        # Phase B). The review refuses any installed distribution that
        # is not pinned in requirements-audit.txt, so the environment
        # must contain exactly the closure. The audit tool runs from a
        # separate step/environment so its own CLI dependencies
        # (license-expression, boolean.py, ...) never contaminate the
        # application's license inventory.
        run: python -m pip install -e ".[dev,research,e2e]"
      - name: License review (deterministic inventory check)
        run: python tools/license_review.py
      - name: Install audit tooling
        run: python -m pip install pip-audit
      - name: Advisory scan (pip-audit over the locked environment)
        # requirements-audit.txt pins the resolved install closure
        # (regenerate via `pip install --dry-run --report` after a
        # dependency change — see docs/release-process.md). The lock IS
        # the resolution, so --disable-pip audits the pins directly
        # with no re-resolution (the pip resolver would try to rebuild
        # the Linux-only closure members on Windows, where CI must not
        # differ). A newly published advisory fails this job loudly.
        run: python -m pip_audit -r requirements-audit.txt --no-deps --disable-pip
